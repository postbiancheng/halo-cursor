name: Check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --locked --all-targets
      - run: ./scripts/pack.sh
      - run: node --test tests/forward-wasm.mjs
      - name: Check package metadata and scripts
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const cargo = fs.readFileSync("Cargo.toml", "utf8")
          const version = cargo.match(/^version = "([^"]+)"$/m)?.[1]
          const pack = JSON.parse(fs.readFileSync("pack.json", "utf8"))
          if (!version || version !== pack.version) {
            throw new Error(`Cargo.toml version ${version} != pack.json version ${pack.version}`)
          }
          NODE
          bash -n scripts/pack.sh
          bash -n scripts/smoke-local.sh
          cd dist
          sha256sum --check agent2api-wasm-halo-cursor-*.zip.sha256
          unzip -tq agent2api-wasm-halo-cursor-*.zip
          entries="$(unzip -Z1 agent2api-wasm-halo-cursor-*.zip)"
          for entry in pack.json wasm.json halo-cursor.wasm assets/logo.svg; do
            grep -Fxq "$entry" <<< "$entries"
          done
